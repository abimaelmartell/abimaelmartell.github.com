<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>
        {% if page.title %}
        {{ page.title }} &ndash; {{ site.name }}
      {% else %}
        {{ site.name }} &ndash; {{ site.description }}
      {% endif %}

    </title>
    <meta name="description" content="{{ site.meta_description}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/main.css?version=0.0.2" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml" />
</head>
<body class="bg-paper text-ink font-serif antialiased">
    {{ content }}

    <footer class="max-w-2xl mx-auto px-5 py-16 text-center">
      <hr class="border-line mb-8" />
      <p class="font-mono text-xs text-faded">
        Abimael Martell &middot; Tijuana, México &middot; made with ♥️ &copy; {{ 'now' | date: "%Y" }}
      </p>
      <p class="font-mono text-xs text-faded mt-2">
        Playas de Tijuana photo by <a class="hover:text-rosa underline underline-offset-2" href="https://unsplash.com/@barbarazandoval" target="_blank" rel="noopener">Barbara Zandoval</a>
      </p>
    </footer>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4MB4Y04XP5"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-4MB4Y04XP5');
    </script>
</body>
</html>
